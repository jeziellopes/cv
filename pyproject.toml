[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "cv"
version = "0.1.0"
description = "Resume generator: edit cv.json, get a PDF."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "playwright>=1.44.0",
    "pdfminer.six>=20240701",
    "pyfiglet>=1.0.4",
    "typer>=0.12.0",
]

[project.scripts]
cv = "generate:main"

[project.optional-dependencies]
# The mailbox reader is optional: nothing else imports it, and inbox.py keeps its
# command a lazy import so the stdlib-only listener never needs these.
mailbox = [
    "google-auth-oauthlib>=1.2.0",
]

[tool.setuptools]
py-modules = ["generate", "ats", "search", "inbox", "evidence", "guards", "skills", "mailscan", "staleness"]