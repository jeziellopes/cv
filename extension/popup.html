<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CV Job Capture</title>
    <style>
      body {
        width: 360px;
        max-height: 560px;
        margin: 0;
        padding: 14px 16px 16px;
        font: 13px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        color: #1a1a1a;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      h2 { font-size: 12px; margin: 0 0 8px; color: #56606b;
           text-transform: uppercase; letter-spacing: 0.04em; }
      .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
      .tab {
        flex: 1;
        padding: 7px 0;
        border: 1px solid #c9c9c9;
        border-radius: 6px;
        background: #fff;
        color: #56606b;
        font: 600 12px inherit;
        cursor: pointer;
      }
      .tab.active {
        background: #0a66c2;
        border-color: #0a66c2;
        color: #fff;
      }
      #list { max-height: 380px; overflow-y: auto; }
      .job {
        padding: 8px 0;
        border-bottom: 1px solid #ececec;
      }
      .head { display: flex; align-items: baseline; gap: 8px; }
      .name { flex: 1; font-weight: 600; }
      .badge {
        flex: 0 0 auto;
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        background: #56606b;
      }
      .badge.captured { background: #8a6116; }
      .badge.cv-ready { background: #0b7a3b; }
      .badge.applied { background: #56606b; }
      .badge.skipped { background: #6b3f3f; }
      code {
        display: block;
        margin: 2px 0 4px;
        font-size: 11px;
        color: #56606b;
      }
      .actions { display: flex; gap: 10px; align-items: center; }
      .actions a { color: #0a66c2; text-decoration: none; font-weight: 600; }
      .actions a:hover { text-decoration: underline; }
      /* The justification is the operator's own words, so it is a text input
         on every row rather than a dialog that interrupts the list. */
      .decline { display: flex; gap: 6px; margin-top: 6px; }
      .reason-input {
        flex: 1;
        min-width: 0;
        padding: 5px 8px;
        border: 1px solid #c9c9c9;
        border-radius: 6px;
        font: 12px inherit;
      }
      .decline-button {
        flex: 0 0 auto;
        padding: 5px 10px;
        border: 1px solid #6b3f3f;
        border-radius: 6px;
        background: #fff;
        color: #6b3f3f;
        font: 600 12px inherit;
        cursor: pointer;
      }
      .decline-button:hover { background: #faf0f0; }
      .reason {
        margin: 2px 0 4px;
        font-size: 12px;
        color: #6b3f3f;
      }
      .reconsider {
        padding: 5px 10px;
        border: 1px solid #56606b;
        border-radius: 6px;
        background: #fff;
        color: #56606b;
        font: 600 12px inherit;
        cursor: pointer;
      }
      .reconsider:hover { background: #f2f3f5; }
      button {
        padding: 6px 10px;
        border: 0;
        border-radius: 6px;
        background: #0a66c2;
        color: #fff;
        font: 600 12px inherit;
        cursor: pointer;
      }
      button.mark { background: #fff; color: #0b7a3b; border: 1px solid #0b7a3b; }
      button.secondary { background: #e8e8e8; color: #1a1a1a; }
      details { margin-top: 12px; }
      summary { cursor: pointer; font-weight: 600; }
      label { display: block; margin: 10px 0 4px; font-weight: 600; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 8px;
        border: 1px solid #c9c9c9;
        border-radius: 6px;
        font: inherit;
      }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      .row button { flex: 1; padding: 8px 10px; }
      .muted { color: #56606b; }
      #status { margin-top: 10px; min-height: 18px; }
      .ok { color: #0b7a3b; }
      .err { color: #b3261e; }
      code { background: transparent; }
    </style>
  </head>
  <body>
    <h1>CV Job Capture</h1>
    <h2>Jobs</h2>
    <div id="tabs" class="tabs">
      <button type="button" class="tab" data-tab="active">Captured</button>
      <button type="button" class="tab" data-tab="applied">Applied</button>
      <button type="button" class="tab" data-tab="skipped">Skipped</button>
    </div>
    <div id="list"></div>

    <details>
      <summary>Connection</summary>
      <p class="muted" style="margin: 8px 0 0">
        Run <code>cv inbox serve</code> and paste the token it prints.
      </p>
      <label for="token">Token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" />
      <label for="port">Port</label>
      <input id="port" type="number" min="1" max="65535" />
      <div class="row">
        <button id="save">Save</button>
        <button id="test" class="secondary">Test</button>
      </div>
    </details>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
